name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Correctness + portability gate: build and run the parity suite on Linux (x86-64 and arm64) and
  # macOS (Apple Silicon / arm64). Intel macOS is not supported. The source has no architecture-specific
  # intrinsics; the portable SIMD kernels compile to SSE2 on x86-64 and NEON on ARM, so a green matrix
  # proves the same byte-identical output on every supported target.
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    # Fail fast if a runner never becomes available instead of sitting in the queue for 24 h.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: x86_64, cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,    arch: x86_64, cc: clang, cxx: clang++ }
          - { os: ubuntu-24.04-arm, arch: arm64,  cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04-arm, arch: arm64,  cc: clang, cxx: clang++ }
          - { os: macos-14,         arch: arm64,  cc: clang, cxx: clang++ }   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install htslib + toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhts-dev cmake python3

      - name: Install htslib + toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install htslib cmake

      - name: Configure & build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # htslib lives in the system paths on Linux (apt) and under the brew prefix on macOS.
          HINTS=""
          if [ "${{ runner.os }}" = "macOS" ]; then HINTS="-DHTSLIB_ROOT=$(brew --prefix htslib)"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $HINTS
          cmake --build build -j3

      - name: Show version and compiled SIMD backend
        run: ./build/vardictcpp --version

      - name: Portability guard (no host-specific ISA baked in)
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          # A portable x86-64 build must not contain AVX/AVX-512; the default flags are architecture
          # baseline only (SSE2). This catches an accidental -march=native creeping back in.
          if objdump -d build/vardictcpp | grep -qE '%zmm|%ymm'; then
            echo "::error::AVX/AVX-512 instructions found in a portable build"; exit 1
          fi
          echo "OK: x86-64 build uses SSE2 baseline only (no AVX/AVX-512)"

      - name: Test suite (parity vs VarDictJava golden)
        run: bash test/run_tests.sh

  # Runtime + memory comparison vs stock VarDictJava 1.8.3 (from bioconda) on the self-contained
  # fixture. Non-blocking (timing on shared CI runners is indicative, not a hard gate); Linux x86 only,
  # since bioconda's vardict-java is the reference and the numbers just need one representative host.
  benchmark:
    name: runtime & memory vs VarDictJava
    needs: build-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install htslib + stock VarDictJava (bioconda)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bench
          create-args: >-
            htslib
            vardict-java=1.8.3
            openjdk

      - name: Build vardictcpp
        shell: bash -el {0}
        run: |
          cmake -S . -B build -DHTSLIB_ROOT="$CONDA_PREFIX" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Benchmark both callers on the fixture
        shell: bash -el {0}
        run: |
          set -euo pipefail
          REF=test/data/tref.fa; BAM=test/data/tref.bam; RGN=tref:1-20001
          measure() {  # -> "wall_seconds|peak_MB|nvars"
            /usr/bin/time -v "$@" >/tmp/out.tsv 2>/tmp/time.txt
            local w r n
            w=$(awk -F': ' '/wall clock/{print $2}' /tmp/time.txt | awk -F: '{print ($1*60)+$2}')
            r=$(awk '/Maximum resident/{printf "%.1f",$6/1024}' /tmp/time.txt)
            n=$(grep -c . /tmp/out.tsv || true)
            echo "${w}|${r}|${n}"
          }
          IFS='|' read cw cr cn < <(measure build/vardictcpp -G $REF -f 0.05 -N t -b $BAM -R $RGN -th 1)
          IFS='|' read jw jr jn < <(measure vardict-java     -G $REF -f 0.05 -N t -b $BAM -R $RGN -th 1)
          spd=$(awk "BEGIN{printf \"%.1f\", $jw/$cw}")
          mem=$(awk "BEGIN{printf \"%.1f\", $jr/$cr}")
          {
            echo "| tool | wall (s) | peak RSS (MB) | variants |"
            echo "|---|---|---|---|"
            echo "| VarDictJava 1.8.3 | ${jw} | ${jr} | ${jn} |"
            echo "| vardictcpp | ${cw} | ${cr} | ${cn} |"
            echo ""
            echo "**vardictcpp is ${spd}x faster and uses ${mem}x less peak memory** on the fixture (test/data, -f 0.05, 1 thread)."
            echo "_Fixture-scale, JVM-startup-inclusive; see bench/ for whole-exome numbers._"
          } >> "$GITHUB_STEP_SUMMARY"
